<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JacksSONS — Music Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>

  <div class="app">
    <aside class="queue">
      <header class="queue__head">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 18V5.5l11-2V16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="17" cy="16" r="3" stroke="currentColor" stroke-width="2" fill="none"/></svg>
          </span>
          <h1>Jacks<em>SONS</em></h1>
        </div>
        <p>Cole um link do YouTube e o som começa na hora.</p>
      </header>

      <form class="add" id="add-form" autocomplete="off">
        <input
          id="add-input"
          type="text"
          placeholder="https://youtube.com/watch?v=..."
          aria-label="Link do YouTube"
        />
        <button type="submit" class="btn btn--primary" title="Adicionar (Enter)">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </form>

      <p class="queue__error" id="error" role="alert" hidden></p>

      <div class="queue__list-head">
        <span>Fila</span>
        <button class="link" id="clear">limpar</button>
      </div>

      <ul class="tracklist" id="tracklist"></ul>

      <p class="queue__empty" id="empty">
        <span class="queue__empty-ico">
          <svg viewBox="0 0 24 24" width="26" height="26"><path d="M9 18V5.5l11-2V16" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="1.6" fill="none"/><circle cx="17" cy="16" r="3" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
        </span>
        Sua fila está vazia<br /><small>Cole um link acima para começar</small>
      </p>
    </aside>

    <main class="stage">
      <div class="cover">
        <div class="cover__glow"></div>
        <img id="cover" alt="" />
        <div class="cover__placeholder" id="cover-placeholder">
          <svg viewBox="0 0 24 24" width="54" height="54"><path d="M9 18V6l10-2v12" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/><circle cx="6.5" cy="18" r="2.6" stroke="currentColor" stroke-width="1.6" fill="none"/><circle cx="16.5" cy="16" r="2.6" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
        </div>
        <span class="cover__badge" id="badge">
          <i></i><i></i><i></i><i></i>
        </span>
      </div>

      <div class="meta">
        <h2 id="title">Nada tocando</h2>
        <p id="artist">Adicione uma música para começar</p>
      </div>

      <div class="seek">
        <span class="time" id="current">0:00</span>
        <div class="bar" id="bar" role="slider" tabindex="0" aria-label="Progresso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="bar__buffer" id="buffer"></div>
          <div class="bar__fill" id="fill"></div>
          <div class="bar__knob" id="knob"></div>
        </div>
        <span class="time" id="duration">0:00</span>
      </div>

      <div class="controls">
        <button class="ctl" id="shuffle" title="Aleatório (S)">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <button class="ctl" id="prev" title="Anterior (←)">
          <svg viewBox="0 0 24 24" width="24" height="24"><path d="M18 5v14L8 12zM6 5v14" stroke="currentColor" stroke-width="2" fill="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <button class="ctl ctl--play" id="play" title="Play/Pause (Espaço)">
          <svg class="ico-play" viewBox="0 0 24 24" width="28" height="28"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>
          <svg class="ico-pause" viewBox="0 0 24 24" width="28" height="28" hidden><path d="M7 4h4v16H7zM13 4h4v16h-4z" fill="currentColor"/></svg>
        </button>

        <button class="ctl" id="next" title="Próxima (→)">
          <svg viewBox="0 0 24 24" width="24" height="24"><path d="M6 5v14l10-7zM18 5v14" stroke="currentColor" stroke-width="2" fill="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <button class="ctl" id="repeat" title="Repetir (R)">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M17 2l4 4-4 4" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 12V9a3 3 0 013-3h15M7 22l-4-4 4-4" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 12v3a3 3 0 01-3 3H3" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="volume">
        <button class="ctl ctl--sm" id="mute" title="Mudo (M)">
          <svg class="ico-vol" viewBox="0 0 24 24" width="20" height="20"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
          <svg class="ico-mute" viewBox="0 0 24 24" width="20" height="20" hidden><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
        </button>
        <div class="bar bar--vol" id="vol-bar" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80">
          <div class="bar__fill" id="vol-fill"></div>
          <div class="bar__knob" id="vol-knob"></div>
        </div>
      </div>

      <p class="hint">
        <kbd>espaço</kbd> play · <kbd>←</kbd><kbd>→</kbd> seek · <kbd>↑</kbd><kbd>↓</kbd> volume ·
        <kbd>m</kbd> mudo · <kbd>s</kbd> shuffle · <kbd>r</kbd> repetir
      </p>

      <div id="yt-player" class="yt-host"></div>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
